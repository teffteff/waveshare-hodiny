name: GitHub Pages

# Web se publikuje při každém pushi do main. Dřív se stavěl jen při změně
# docs/, takže běžný commit do firmware nechal na Pages viset starší nasazení,
# a když ho přepsal starý Jekyll build z větve, zmizel z webu instalátor
# i firmware/ota.json a hodinám přestala fungovat kontrola aktualizací.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pre-release (zrcadlo SDK 7", kandidáti) web nemění; prostředí github-pages
    # by jeho tag stejně odmítlo a běh by skončil chybou.
    if: github.event_name != 'release' || !github.event.release.prerelease
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Statická část webu a obsahové verze CSS a JS (stejně v release a CI).
          python3 tools/prepare_pages_site.py _site

          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --exclude-drafts --exclude-pre-releases --json tagName)"
          latest_tag="$(jq -r '.[0].tagName // empty' <<<"$releases")"
          if [[ -n "$latest_tag" ]]; then
            while IFS= read -r tag; do
              version="${tag#v}"
              release_dir="_site/firmware/releases/$version"
              mkdir -p "$release_dir"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
                --pattern manifest.json \
                --pattern waveshare-hodiny.bootloader.bin \
                --pattern waveshare-hodiny.partitions.bin \
                --pattern waveshare-hodiny.boot-app0.bin \
                --pattern waveshare-hodiny.app.bin
              # 7" je v release až od verze, která ho přinesla; starší nic nemají.
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
                --pattern manifest-lcd7.json \
                --pattern 'waveshare-hodiny-lcd7.bootloader.bin' \
                --pattern 'waveshare-hodiny-lcd7.partitions.bin' \
                --pattern 'waveshare-hodiny-lcd7.boot-app0.bin' \
                --pattern 'waveshare-hodiny-lcd7.app.bin' 2>/dev/null || true
            done < <(jq -r '.[].tagName' <<<"$releases")

            # Katalog: u každé verze manifest kulaté 2,1", u verzí se 7" i manifestLcd7.
            while IFS= read -r version; do
              dir="_site/firmware/releases/$version"
              if [[ -f "$dir/manifest-lcd7.json" ]]; then
                jq -n --arg v "$version" '{version: $v, manifest: ("firmware/releases/" + $v + "/manifest.json"), manifestLcd7: ("firmware/releases/" + $v + "/manifest-lcd7.json")}'
              else
                jq -n --arg v "$version" '{version: $v, manifest: ("firmware/releases/" + $v + "/manifest.json")}'
              fi
            done < <(jq -r '.[].tagName | ltrimstr("v")' <<<"$releases") \
              | jq -s '{releases: .}' > _site/firmware/releases.json

            gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --dir _site/firmware \
              --pattern manifest.json \
              --pattern waveshare-hodiny.bootloader.bin \
              --pattern waveshare-hodiny.partitions.bin \
              --pattern waveshare-hodiny.boot-app0.bin \
              --pattern waveshare-hodiny.app.bin \
              --pattern waveshare-hodiny.ota.bin \
              --pattern ota.json
            gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --dir _site/firmware \
              --pattern manifest-lcd7.json \
              --pattern 'waveshare-hodiny-lcd7.*.bin' \
              --pattern ota-lcd7.json 2>/dev/null || true
          else
            echo "No public firmware release exists yet; installer stays disabled."
          fi

      - name: Validate installer bundle
        run: python3 tools/validate_pages_bundle.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Nasazení může přepsat jiný zdroj Pages (klasický build z větve). Web by
      # pak tiše ztratil instalátor i OTA metadata, takže se po nasazení ověří,
      # co je opravdu online.
      - name: Verify published site
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          failed=0
          paths=(index.html styles.css app.js)
          # Bez publikovaného release web firmware adresář nemá, viz "Prepare site".
          if [[ -f _site/firmware/ota.json ]]; then paths+=(firmware/ota.json); fi
          if [[ -f _site/firmware/ota-lcd7.json ]]; then paths+=(firmware/ota-lcd7.json); fi
          for path in "${paths[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors \
              --retry-delay 10 --max-time 30 "$base/$path" || echo 000)"
            printf '%-24s %s\n' "$path" "$code"
            [[ "$code" == "200" ]] || failed=1
          done
          if (( failed )); then
            echo "::error::Publikovaný web neodpovídá nahranému artefaktu. Zkontroluj Settings -> Pages -> Source, musí být GitHub Actions." >&2
            exit 1
          fi
