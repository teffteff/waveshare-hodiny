name: Public firmware release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to build, for example 1.4.0
        required: true
        type: string
      publish_stable_release:
        description: Create the public GitHub Release after validation
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: public-firmware-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Validate stable version and release target
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish_stable_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Public stable release requires MAJOR.MINOR.PATCH without prerelease or build metadata." >&2
            exit 1
          fi
          if [[ "$PUBLISH" == "true" ]] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists and is immutable." >&2
            exit 1
          fi

      # Stejné nastavení i cache jako firmware-build.yml při každém pushi,
      # takže den vydání není první běh stahování toolchainu ani SDK 7".
      - name: Firmware toolchain
        uses: ./.github/actions/firmware-toolchain
        with:
          lcd7: true

      - name: Build public release without local secrets
        env:
          RELEASE_CHANNEL: public
        run: ./build-release.sh "${{ inputs.version }}"

      # 7" má vlastní knihovny ESP-IDF (tools/setup_lcd7_sdk.sh) a vlastní
      # názvy souborů (-lcd7), takže kulatá 2,1" jeho obraz nikdy nestáhne.
      - name: Build public 7-inch release
        env:
          RELEASE_CHANNEL: public
          BOARD: lcd7
        # ARDUINO_STOCK_DATA_DIR pro tools/setup_lcd7_sdk.sh nastavuje akce toolchainu.
        run: ./build-release.sh "${{ inputs.version }}"

      - name: Validate complete Pages and OTA bundle
        run: |
          # Statická část webu včetně obsahových verzí CSS a JS jako v pages.yml.
          python3 tools/prepare_pages_site.py _site
          cp build/waveshare-hodiny-release/${{ inputs.version }}-public/package/manifest.json _site/firmware/
          cp build/waveshare-hodiny-release/${{ inputs.version }}-public/package/ota.json _site/firmware/
          cp build/waveshare-hodiny-release/${{ inputs.version }}-public/package/waveshare-hodiny.*.bin _site/firmware/
          lcd7=build/waveshare-hodiny-release/${{ inputs.version }}-public-lcd7/package
          cp "$lcd7/manifest-lcd7.json" "$lcd7/ota-lcd7.json" _site/firmware/
          cp "$lcd7"/waveshare-hodiny-lcd7.*.bin _site/firmware/
          python3 tools/validate_pages_bundle.py _site

      - name: Upload validated package artifact
        uses: actions/upload-artifact@v7
        with:
          name: waveshare-hodiny-${{ inputs.version }}-public
          path: |
            build/waveshare-hodiny-release/${{ inputs.version }}-public/package/
            build/waveshare-hodiny-release/${{ inputs.version }}-public-lcd7/package/
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable GitHub Release
        if: ${{ inputs.publish_stable_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            build/waveshare-hodiny-release/$VERSION-public/package/manifest.json \
            build/waveshare-hodiny-release/$VERSION-public/package/ota.json \
            build/waveshare-hodiny-release/$VERSION-public/package/waveshare-hodiny.bootloader.bin \
            build/waveshare-hodiny-release/$VERSION-public/package/waveshare-hodiny.partitions.bin \
            build/waveshare-hodiny-release/$VERSION-public/package/waveshare-hodiny.boot-app0.bin \
            build/waveshare-hodiny-release/$VERSION-public/package/waveshare-hodiny.app.bin \
            build/waveshare-hodiny-release/$VERSION-public/package/waveshare-hodiny.ota.bin \
            build/waveshare-hodiny-release/$VERSION-public/package/waveshare-hodiny.elf \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/manifest-lcd7.json \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/ota-lcd7.json \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/waveshare-hodiny-lcd7.bootloader.bin \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/waveshare-hodiny-lcd7.partitions.bin \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/waveshare-hodiny-lcd7.boot-app0.bin \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/waveshare-hodiny-lcd7.app.bin \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/waveshare-hodiny-lcd7.ota.bin \
            build/waveshare-hodiny-release/$VERSION-public-lcd7/package/waveshare-hodiny-lcd7.elf \
            --repo "$GITHUB_REPOSITORY" \
            --title "Waveshare Hodiny $VERSION" \
            --generate-notes \
            --latest \
            --target "$GITHUB_SHA"

      # Seznam release je za vytvořením o chvíli pozadu: 9. 10. 2026 Pages
      # nasazené hned po "gh release create" ještě viděly jen předchozí verzi
      # a ota.json zůstal starý. Proto se napřed počká, až se nová verze
      # v seznamu objeví, a teprve pak se Pages spustí.
      - name: Trigger Pages deployment for published release
        if: ${{ inputs.publish_stable_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --exclude-drafts --exclude-pre-releases --json tagName \
                | jq -e --arg tag "v$VERSION" '.[0].tagName == $tag' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Release v$VERSION is still not the latest in the release list." >&2
              exit 1
            fi
            sleep 5
          done
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
