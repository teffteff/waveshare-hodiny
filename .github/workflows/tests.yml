name: Tests

# Testy na počítači: firmwarové moduly přes tools/run_host_tests.sh (testy
# serverové části běží od 27. 9. 2026 v jejím soukromém repozitáři) a kouřový
# test balení obou desek (tools/test_release_package.sh). Překlad firmwaru
# je ve firmware-build.yml. Běží
# při každém pushi a PR a public-release.yml je volá před sestavením, aby
# nevyšel firmware s rozbitým parserem.
#
# macOS kvůli mbedTLS 3 z Homebrew, proti kterému se překládá test šifrování
# zálohy (stejně jako na vývojovém Macu); Ubuntu má v balíčcích jen 2.28.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mbedTLS 3
        run: brew install mbedtls@3

      # Mapa dopravy (test traffic_render) kreslí jména písmem hodin, takže
      # potřebuje kousek zdrojáků LVGL; stejná verze, jakou instaluje release
      # build. Adresář leží v "libraries/" jako u Arduina, protože se hlavičky
      # hledají i o úroveň výš (-I "$LVGL_DIR/..").
      - name: Install LVGL 8.3.10 sources
        run: |
          git clone --quiet --depth 1 --branch v8.3.10 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/libraries/lvgl"
          echo "LVGL_DIR=$RUNNER_TEMP/libraries/lvgl" >> "$GITHUB_ENV"

      - name: Host tests
        run: bash tools/run_host_tests.sh

  # Balení a validace webu s umělými obrazy obou desek; bez arduino-cli,
  # takže chybu v prepare_release_package.py nebo validate_pages_bundle.py
  # odhalí za pár sekund i v PR, který firmware nemění.
  release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Packaging smoke test
        run: bash tools/test_release_package.sh
